name: VPN Gate Node Check

# 模板仓库默认不配置定时任务：需要自动更新时，把下面的注释替换成你自己的 cron。
# 注意：GitHub 调度最小间隔约 5 分钟，但通常会延迟几分钟；仓库连续 60 天无提交会让定时任务自动停用。
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      max_nodes:
        description: '最多检测多少个节点（0 = 全部）'
        required: false
        default: '0'
      concurrency:
        description: '并发数（建议 16–32）'
        required: false
        default: '32'
      timeout:
        description: '单节点检测超时（秒）'
        required: false
        default: '25'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DOMAIN: ${{ secrets.DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Fetch VPN Gate nodes
        run: |
          set -euo pipefail
          python3 scripts/fetch_vpngate.py --out nodes_raw.txt
          echo "--- nodes_raw.txt ---"
          wc -l nodes_raw.txt || true
          head -5 nodes_raw.txt

      - name: Check nodes via Worker
        env:
          MAX_NODES: ${{ inputs.max_nodes || '0' }}
          CONCURRENCY: ${{ inputs.concurrency || '32' }}
          TIMEOUT: ${{ inputs.timeout || '25' }}
        run: |
          set -euo pipefail
          go run ./cmd/check --in nodes_raw.txt --out nodes_checked.txt --max "$MAX_NODES" --concurrency "$CONCURRENCY" --timeout "$TIMEOUT"
          echo "--- nodes_checked.txt ---"
          wc -l nodes_checked.txt || true
          head -5 nodes_checked.txt

      - name: Generate output files
        run: |
          set -euo pipefail
          python3 scripts/generate_outputs.py --in nodes_checked.txt --out-dir public
          ls -la public
          echo "--- public/index.html (head) ---"
          head -20 public/index.html
          echo "--- public/nodes.txt (head) ---"
          head -5 public/nodes.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
